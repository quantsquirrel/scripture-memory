# 6자리 코드 기기 연동 릴레이. 배포 절차는 pairing-relay.ts 머리 주석 참고.
name = "ivan-pairing-relay"
main = "pairing-relay.ts"
compatibility_date = "2026-10-01"

[vars]
# 쉼표로 구분, 공백 없이. 앱이 배포된 출처와 로컬 개발 서버.
ALLOWED_ORIGINS = "https://quantsquirrel.github.io,http://localhost:5173"

[[kv_namespaces]]
binding = "PAIRING"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
