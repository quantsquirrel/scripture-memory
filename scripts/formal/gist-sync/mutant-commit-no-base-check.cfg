\* 변이: commitRating이 기준 상태를 확인하지 않는다 → 화면의 옛 사본으로 채점해 동기화가
\* 가져온 카드를 되돌리므로 CommitExtendsStored가 깨져야 한다. 옛 사본 커밋도 lr은 가장
\* 늦으므로 ProgressSurvives(lr 단조)로는 잡히지 않는다.
SPECIFICATION Spec
CONSTANTS
    Devices = {"A", "B"}
    SyncTabs = 1
    MaxReviews = 2
    MaxSyncs = 2
    CommitDuringSync = TRUE
    SessionAcrossSync = TRUE
    BaseMatches <- MutNoBaseCheck
PROPERTY
    CommitExtendsStored
CHECK_DEADLOCK FALSE
