\* 변이: syncNow가 기기별 잠금 없이 돈다 → 같은 기기의 늦은 push가 자기 파일을 옛 내용으로 덮어 SyncedStaysSynced가 깨져야 한다
SPECIFICATION Spec
CONSTANTS
    Devices = {"A"}
    SyncTabs = 2
    MaxReviews = 2
    MaxSyncs = 2
    CommitDuringSync = TRUE
    SessionAcrossSync = TRUE
    SyncLockFree <- MutNoSyncLock
INVARIANT
    SyncedStaysSynced
CHECK_DEADLOCK FALSE
