\* 변이: mergeBundles가 옛 규칙(reps 많은 쪽)으로 돌아간다 → 더 늦게 복습한 로컬 카드가 reps
\* 많은 옛 원격 카드에 덮여 ProgressSurvives가 깨져야 한다
SPECIFICATION Spec
CONSTANTS
    Devices = {"A", "B"}
    SyncTabs = 1
    MaxReviews = 2
    MaxSyncs = 2
    CommitDuringSync = TRUE
    SessionAcrossSync = TRUE
    MergeCard <- MutMergeCardMoreReps
PROPERTY
    ProgressSurvives
CHECK_DEADLOCK FALSE
