name: CI · GitHub Pages 배포

on:
  push:
    branches: [main]
  # PR에서는 검사(build)만 돈다 — 배포는 main push에서만 (deploy의 if)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 같은 브랜치에 새 커밋이 오면 이전 검사는 취소한다. PR 실행이 main 배포를 취소하지 않도록 ref별로 묶는다.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run typecheck
      - run: npm run build
        env:
          # 6자리 코드 연동 릴레이 주소 (저장소 변수). 비어 있으면 연동 기능이 꺼진 채 빌드된다.
          VITE_PAIRING_RELAY_URL: ${{ vars.PAIRING_RELAY_URL }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Pages 쓰기 권한은 배포 job에만 준다 — PR 코드가 도는 build는 읽기 전용
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
