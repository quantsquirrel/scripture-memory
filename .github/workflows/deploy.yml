name: CI · GitHub Pages 배포

on:
  push:
    branches: [main]
  # PR에서는 검사(build)만 돈다 — 배포는 main push에서만 (deploy의 if)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 같은 브랜치에 새 커밋이 오면 이전 검사는 취소한다. PR 실행이 main 배포를 취소하지 않도록 ref별로 묶는다.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run typecheck
      - run: npm run build
        env:
          # 6자리 코드 연동 릴레이 주소 (저장소 변수). 비어 있으면 연동 기능이 꺼진 채 빌드된다.
          VITE_PAIRING_RELAY_URL: ${{ vars.PAIRING_RELAY_URL }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 두 프로젝트(chromium·mobile=Pixel 7) 모두 chromium으로 돈다
      - run: npx playwright install --with-deps chromium
      # 릴레이 주소 없이 빌드한다 — 로컬 e2e와 같은 조건이고, 테스트가 네트워크에 기대지 않게
      - run: npm run e2e

  # 기계로 잡을 수 있는 하드 경계·데이터 감사. PR에서만 돈다 — deploy의 needs에 넣지 않는다
  # (push에서 건너뛰면 deploy까지 건너뛰게 된다).
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: guard-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 하드 경계 3: 골든 fixture는 과거 사용자 데이터의 대역이다. 추가만 허용한다.
      - name: 기존 fixture 수정·삭제 금지
        env:
          BASE: ${{ github.base_ref }}
        run: |
          bad=$(git diff --name-status --diff-filter=MDR "origin/$BASE...HEAD" -- tests/fixtures/)
          if [ -n "$bad" ]; then
            echo "기존 fixture는 수정·삭제·이름변경할 수 없다. 새 버전은 새 fixture로 추가한다:"
            echo "$bad"
            exit 1
          fi
      - run: npm run verify:data
      - run: npm run audit:contrast

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    # Pages 쓰기 권한은 배포 job에만 준다 — PR 코드가 도는 build는 읽기 전용
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5

  # main push 결과(검사·배포)를 에이전트 수신함으로 보낸다. 에이전트가 배포를 기다리며
  # 세션을 열어 두지 않게 하려는 것이다. 저장소 secret PINKY_HOOK_URL이 없으면 아무것도 안 한다.
  notify:
    if: always() && github.event_name == 'push'
    needs: [build, e2e, deploy]
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ secrets.PINKY_HOOK_URL }}
          TOKEN: ${{ secrets.PINKY_HOOK_TOKEN }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          DEPLOY: ${{ needs.deploy.result }}
          # 커밋 메시지는 env로만 넘긴다 — run 안에 직접 펼치면 셸 인젝션이 된다
          MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "PINKY_HOOK_URL이 없어 알림을 건너뛴다"
            exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg msg "$MSG" \
            --arg build "$BUILD" --arg e2e "$E2E" --arg deploy "$DEPLOY" --arg run "$RUN_URL" \
            '{repo:$repo, sha:$sha, message:$msg, results:{build:$build, e2e:$e2e, deploy:$deploy}, run_url:$run}' |
            curl -fsS -X POST "$HOOK" -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' --data-binary @-
